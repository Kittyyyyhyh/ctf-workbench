name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax
        run: python -m py_compile ctfcli/cli.py ctfcli/__main__.py scripts/check_intel.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Intel front-matter
        run: python scripts/check_intel.py

      - name: Shell scripts
        run: shellcheck ctf examples/*/start.sh armory/scenarios/*/scene/plant.sh armory/scenarios/*/harness/*.sh

      - name: Dockerfiles (hadolint)
        run: |
          for f in armory/*/Dockerfile; do
            echo "== $f"
            docker run --rm -i hadolint/hadolint:latest < "$f"
          done
