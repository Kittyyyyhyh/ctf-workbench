name: publish

# Build and push the sandbox images to GHCR.
# Images are large (~13GB total), so each type builds in its own job.
# Trigger manually from the Actions tab; base is always (re)built first.
on:
  workflow_dispatch:
    inputs:
      types:
        description: "Comma-separated types to publish (default: all)"
        required: false
        default: "base,web,pwn,crypto,reverse,forensics,ir,ai,osint"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.o.outputs.owner }}
      types: ${{ steps.t.outputs.types }}
    steps:
      - id: o
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: t
        run: |
          input="${{ github.event.inputs.types }}"
          if [ -z "$input" ]; then input="base,web,pwn,crypto,reverse,forensics,ir,ai,osint"; fi
          json=$(echo "$input" | tr -d ' ' | jq -c -R 'split(",") | map(select(length > 0))')
          echo "types=$json" >> "$GITHUB_OUTPUT"

  base:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: armory/base
          tags: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/ctf-base:latest
          push: true

  images:
    needs: [prepare, base]
    if: ${{ needs.prepare.outputs.types != '["base"]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        type: ${{ fromJSON(needs.prepare.outputs.types) }}
        exclude:
          - type: base
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # domain images build FROM ctf-base: retag the freshly pushed GHCR base
      - name: Retag base
        run: |
          docker pull "${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/ctf-base:latest"
          docker tag "${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/ctf-base:latest" ctf-base:latest
      - uses: docker/build-push-action@v6
        with:
          context: armory/${{ matrix.type }}
          tags: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/ctf-${{ matrix.type }}:latest
          push: true
