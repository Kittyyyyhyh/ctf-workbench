name: publish

# Build and push the sandbox images to GHCR.
# Images are large (~13GB total), so each type builds in its own job.
# Uses plain docker build/push: the domain images build FROM a locally built
# ctf-base (a buildx container-driver builder cannot see local daemon images,
# and pulling the just-pushed GHCR base races its repo linking).
on:
  workflow_dispatch:
    inputs:
      types:
        description: "Comma-separated types to publish (default: all)"
        required: false
        default: "base,web,pwn,crypto,reverse,forensics,ir,ai,osint"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.o.outputs.owner }}
      types: ${{ steps.t.outputs.types }}
    steps:
      - id: o
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: t
        run: |
          input="${{ github.event.inputs.types }}"
          if [ -z "$input" ]; then input="base,web,pwn,crypto,reverse,forensics,ir,ai,osint"; fi
          json=$(echo "$input" | tr -d ' ' | jq -c -R 'split(",") | map(select(length > 0))')
          echo "types=$json" >> "$GITHUB_OUTPUT"

  base:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
      - name: Build and push ctf-base
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/ctf-base:latest armory/base
          docker push ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/ctf-base:latest

  images:
    needs: [prepare, base]
    if: ${{ needs.prepare.outputs.types != '["base"]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        type: ${{ fromJSON(needs.prepare.outputs.types) }}
        exclude:
          - type: base
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
      - name: Build base locally
        run: docker build -t ctf-base armory/base
      - name: Build and push ctf-${{ matrix.type }}
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/ctf-${{ matrix.type }}:latest armory/${{ matrix.type }}
          docker push ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/ctf-${{ matrix.type }}:latest
