name: ctf-armory

# Build args are read from the environment, so regional mirrors can be set
# without editing this file:
#   export APT_MIRROR=https://mirrors.tuna.tsinghua.edu.cn/ubuntu
#   export PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
#   export GH_PROXY=https://ghproxy.net/
x-build-args: &build-args
  args:
    APT_MIRROR: ${APT_MIRROR:-}
    PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    GH_PROXY: ${GH_PROXY:-}

services:
  base:
    image: ctf-base
    build:
      <<: *build-args
      context: ./base
    profiles: ["base"]

  web:
    image: ctf-web
    build:
      <<: *build-args
      context: ./web
    profiles: ["web"]

  pwn:
    image: ctf-pwn
    build:
      <<: *build-args
      context: ./pwn
    profiles: ["pwn"]

  crypto:
    image: ctf-crypto
    build:
      context: ./crypto
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        GH_PROXY: ${GH_PROXY:-}
        INSTALL_SAGE: ${INSTALL_SAGE:-0}
    profiles: ["crypto"]

  reverse:
    image: ctf-reverse
    build:
      <<: *build-args
      context: ./reverse
    profiles: ["reverse"]

  forensics:
    image: ctf-forensics
    build:
      <<: *build-args
      context: ./forensics
    profiles: ["forensics"]

  ir:
    image: ctf-ir
    build:
      <<: *build-args
      context: ./ir
    profiles: ["ir"]

  ai:
    image: ctf-ai
    build:
      <<: *build-args
      context: ./ai
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        GH_PROXY: ${GH_PROXY:-}
        INSTALL_GARAK: ${INSTALL_GARAK:-0}
    profiles: ["ai"]

  osint:
    image: ctf-osint
    build:
      <<: *build-args
      context: ./osint
    profiles: ["osint"]

  pentest:
    image: ctf-pentest
    build:
      <<: *build-args
      context: ./pentest
    profiles: ["pentest"]
